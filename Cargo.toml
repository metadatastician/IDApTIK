# IDApTIK Cargo workspace.
#
# Layout follows ADR-0003: gameplay truth lives in an engine-agnostic `core`
# crate; `bevy` is the selected rendering frontend over it; `ffi` is the C-ABI
# surface that Zig/Idris2 bind to (ADR-0001, ADR-0008).
[workspace]
resolver = "2"
members = [
    "crates/idaptik-core",
    "crates/idaptik-ffi",
    "crates/idaptik-tui",
    "crates/idaptik-net",
    "crates/idaptik-bevy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["IDApTIK contributors"]
repository = "https://github.com/metadatastician/IDApTIK"

[workspace.dependencies]
idaptik-core = { path = "crates/idaptik-core", version = "0.1.0" }
idaptik-tui = { path = "crates/idaptik-tui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` guarantees bit-exact f64 JSON round-trips (snapshots/exports).
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
bevy = "0.19"
bevy_winit = { version = "0.19.1", default-features = false, features = ["wayland-csd-adwaita-notitle"] }
# The client-side session transport (ADR-0006 §2): async runtime + WebSocket.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
idaptik-net = { path = "crates/idaptik-net", version = "0.1.0" }
burble-client = { git = "https://github.com/metadatastician/burble", rev = "80307f00dcc51494735fe8f4ba2c64bdd198ac1c", version = "1.0.0" }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[patch.crates-io]
bevy_winit = { path = "vendor/bevy_winit" }
