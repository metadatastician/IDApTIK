name: GitHub Pages (Ddraig SSG)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout Site
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Checkout Ddraig SSG
        run: |
          git init .ddraig-ssg
          git -C .ddraig-ssg remote add origin https://github.com/hyperpolymath/ddraig-ssg.git
          git -C .ddraig-ssg fetch --no-tags --depth=1 origin e1282f35e8999175e8d143436aa754367cc9800e
          git -C .ddraig-ssg checkout --detach --force FETCH_HEAD
      - name: Compile Ddraig
        working-directory: .ddraig-ssg
        run: idris2 Ddraig.idr -o ddraig
      - name: Build site
        run: |
          mkdir -p src
          if [ ! -f src/index.md ] && [ -f README.md ]; then
            cp README.md src/index.md
          elif [ ! -f src/index.md ]; then
            echo "# ${GITHUB_REPOSITORY}" > src/index.md
          fi
          ./.ddraig-ssg/build/exec/ddraig build src _site https://idaptik.net
      # RFC 9116 requires security.txt at /.well-known/ on the domain. The SSG
      # builds from src/ and does not carry dotfile directories through, so it
      # is copied into the artifact explicitly. Without this the file exists in
      # the repository and 404s on the site, which is the same as not having one.
      - name: Publish .well-known/security.txt
        run: |
          set -euo pipefail
          test -f .well-known/security.txt
          mkdir -p _site/.well-known
          cp .well-known/security.txt _site/.well-known/security.txt
          echo "published:"; cat _site/.well-known/security.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
