# This workflow is managed by gh actions-lock.

name: GitHub Pages (Ddraig SSG)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout Site
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --force FETCH_HEAD
      - name: Checkout Ddraig SSG
        run: |
          git init .ddraig-ssg
          git -C .ddraig-ssg remote add origin https://github.com/hyperpolymath/ddraig-ssg.git
          git -C .ddraig-ssg fetch --no-tags --depth=1 origin e1282f35e8999175e8d143436aa754367cc9800e
          git -C .ddraig-ssg checkout --detach --force FETCH_HEAD
      - name: Compile Ddraig
        working-directory: .ddraig-ssg
        run: idris2 Ddraig.idr -o ddraig
      - name: Build site
        run: |
          mkdir -p src
          if [ ! -f src/index.md ] && [ -f README.md ]; then
            cp README.md src/index.md
          elif [ ! -f src/index.md ]; then
            echo "# ${GITHUB_REPOSITORY}" > src/index.md
          fi
          ./.ddraig-ssg/build/exec/ddraig build src _site https://idaptik.net
      # RFC 9116 requires security.txt at /.well-known/ on the domain, and RSR
      # criterion 2.2.1 (silver) requires ai.txt and humans.txt beside it. The
      # SSG builds from src/ and does not carry dotfile directories through, so
      # they are copied into the artifact explicitly. Without this the files
      # exist in the repository and 404 on the site, which is the same as not
      # having one -- and a criterion checked against the deployed URL would
      # read the 404 as absent, correctly.
      #
      # This step used to name security.txt alone. Adding a file to
      # .well-known/ without adding it here produces the exact silent failure
      # the comment above warns about: the commit looks complete, the Pages
      # deploy goes green, and the new file 404s. So the loop copies EVERY file
      # in the directory and the count is printed. A file that is present in the
      # repository but missing from the artifact now fails the build instead of
      # failing quietly a month later.
      - name: Publish .well-known/ (security.txt, ai.txt, humans.txt)
        run: |
          # The idris2-pack container has no bash, so this step runs under dash;
          # `set -o pipefail` is a bashism that aborts the step at line 1 there.
          set -eu
          mkdir -p _site/.well-known
          src_count=0
          for f in .well-known/*; do
            test -f "$f" || continue
            cp "$f" "_site/.well-known/$(basename "$f")"
            src_count=$((src_count + 1))
          done
          # Printed denominator: "published 0 of 0" reading as success is the
          # failure mode this step exists to prevent.
          dst_count=0
          for f in _site/.well-known/*; do
            test -f "$f" || continue
            dst_count=$((dst_count + 1))
          done
          echo ".well-known: $src_count file(s) in the repository, $dst_count published into the artifact"
          test "$src_count" -gt 0 || { echo "ERROR: .well-known/ is empty in the repository"; exit 1; }
          test "$src_count" -eq "$dst_count" || { echo "ERROR: published count does not match source count"; exit 1; }
          for f in security.txt ai.txt humans.txt; do
            test -f "_site/.well-known/$f" || { echo "ERROR: RSR 2.2.1 requires .well-known/$f"; exit 1; }
          done
          echo "--- security.txt ---"; cat _site/.well-known/security.txt
          echo "--- ai.txt (head) ---"; head -20 _site/.well-known/ai.txt
          echo "--- humans.txt (head) ---"; head -20 _site/.well-known/humans.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'
          # The action defaults to excluding every dot-entry from the artifact
          # tar (--exclude='.[^/]*'), which silently dropped _site/.well-known
          # while the publish step above went green.
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
