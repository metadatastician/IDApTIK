# Dependabot configuration for IDApTIK's actual package ecosystems.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Rust/Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Elixir/Mix
  - package-ecosystem: "mix"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
