# SPDX-License-Identifier: AGPL-3.0-or-later
# Repository settings mirrored for the probot/settings app. Branch policy is
# managed through GitHub repository rulesets so this file cannot install stale
# required-check names.

repository:
  name: "IDApTIK"
  description: "If you have to ask, you're already compromised. Asymmetric infiltration: one infiltrator, one hacker, zero shared control."
  homepage: "https://idaptik.net"
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "security"
    color: "b60205"
    description: "Security-related work; report vulnerabilities privately"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "question"
    color: "d876e3"
    description: "Further information is requested"
  - name: "dependencies"
    color: "0366d6"
    description: "Dependency updates"
  - name: "ci/cd"
    color: "fbca04"
    description: "Continuous integration and deployment"
