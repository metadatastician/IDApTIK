# SPDX-License-Identifier: MPL-2.0
# SonarCloud configuration.
# Project: https://sonarcloud.io/project/overview?id=metadatastician_IDApTIK
# Requires the SONAR_TOKEN repository secret and a provisioned project under
# the organisation named below. Both are owner setup; without the token the
# scan fails at authentication and submits nothing.
#
# ── THIS FILE CONTRADICTED ITSELF UNTIL 2026-09-27 ──────────────────────────
# BEGIN RETIRED-VALUES QUOTE
# The values were, and still are:
#     sonar.organization=metadatastician
#     sonar.projectKey=metadatastician_IDApTIK
# The prose above them asserted:
#     "Organisation is `hyperpolymath`, decided in PR #42 and closing issue #38.
#      The estate consolidates SonarCloud under a single organisation, so
#      metadatastician-org GitHub repos still use `hyperpolymath` here."
# which implies a projectKey of hyperpolymath_IDApTIK.
# END RETIRED-VALUES QUOTE
#
# The block above sits between explicit markers because it quotes the retired
# claim verbatim. tests/ci_security_config_test.sh's check_sonar_consistency
# skips everything between BEGIN and END RETIRED-VALUES QUOTE; without the
# markers that check would read this provenance note as a second, conflicting
# projectKey and fail on a clean tree. That is the same class of bug as a
# security contact named only inside a comment, and it is why the check has a
# firing fixture for exactly this shape. Quoting the retired value is what makes
# the history auditable; silently dropping it is not.
#
# Both readings cannot be true, and the prose was the more confident of the two,
# so a reader following it would "fix" the working values and break the scan.
# The direction of the fix matters: as the old comment itself warned, adding
# SONAR_TOKEN to a repository whose projectKey is wrong does not fail loudly —
# it silently reports into a different project, which is worse than failing.
#
# What could be established from inside this repository:
#   * The two values are mutually consistent, and consistent with the overview
#     URL in the header, which names metadatastician_IDApTIK.
#   * Issue #38 was closed by PR #42. The closing text is what the retired
#     prose paraphrases, so a hyperpolymath decision was genuinely made at some
#     point; it was simply never reflected in these two lines, or was reflected
#     and later reverted. Which is not recoverable from the working tree.
# What could NOT be established: sonarcloud.io is unreachable from the
# development sandbox (the TLS handshake fails), so neither
# metadatastician_IDApTIK nor the hyperpolymath alternative could be queried to
# see which project actually exists and receives data. Picking one on that
# evidence would replace an old unverified claim with a new one.
#
# So the values are left exactly as they were found, the prose now describes
# them rather than contradicting them, and the question is recorded as an open
# owner ruling: docs/decisions-pending/DR-0001-sonarcloud-organisation.md.
#
# ⚠ IF THE OWNER RULES `hyperpolymath`: change sonar.organization AND
# sonar.projectKey AND the overview URL in this header, in one commit, BEFORE
# SONAR_TOKEN is added to this repository. check_sonar_consistency fails a
# partial edit, so the three cannot drift apart again.
sonar.organization=metadatastician
sonar.projectKey=metadatastician_IDApTIK

# Elixir and Nickel have no SonarCloud analyser; build artefacts, vendored
# deps and lockfiles are excluded to keep findings signal-rich (mirrors the
# cadastra/boj-server arrangement).
#
# `fixtures/**` is excluded because those files are deliberately wrong: they
# are planted mutants whose whole purpose is to be rejected by a gate, so any
# finding raised against one is a finding about a fixture doing its job.
sonar.exclusions=**/target/**,Cargo.lock,fixtures/**
sonar.coverage.exclusions=**/tests/**,**/*test*
