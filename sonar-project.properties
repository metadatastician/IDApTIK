# SonarQube Cloud (SonarCloud) configuration.
# Project: https://sonarcloud.io/project/overview?id=hyperpolymath_IDApTIK
# Requires the SONAR_TOKEN repository secret + a provisioned hyperpolymath_IDApTIK
# project (both owner setup).
#
# Organisation is `hyperpolymath`, decided in PR #42 and closing issue #38.
# The estate consolidates SonarCloud under a single organisation, so
# metadatastician-org GitHub repos still use `hyperpolymath` here -- the
# GitHub-org boundary deliberately does not mirror the SonarCloud one.
#
# Two things to know before touching SonarCloud config elsewhere in the estate:
#   - Several template-derived repos still carry a stale
#     hyperpolymath_rsr-template-repo key from copy-paste. Do not follow those.
#   - Fix a wrong projectKey BEFORE adding SONAR_TOKEN to a repo. Without the
#     token the scan fails at authentication and submits nothing; with the token
#     and a wrong key it silently reports into another project, which is worse.
sonar.organization=hyperpolymath
sonar.projectKey=hyperpolymath_IDApTIK

# Elixir and Nickel have no SonarCloud analyser; build artefacts, vendored
# deps and lockfiles are excluded to keep findings signal-rich (mirrors the
# cadastra/boj-server arrangement).
sonar.exclusions=**/target/**,Cargo.lock,fixtures/**
sonar.coverage.exclusions=**/tests/**,**/*test*
