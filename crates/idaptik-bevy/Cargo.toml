[package]
name = "idaptik-bevy"
description = "Selected Bevy rendering frontend for IDApTIK (ADR-0008)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# On Linux, Bevy needs system libraries (alsa, udev, windowing) to build/run —
# install them with `just bevy-linux-deps`.
[dependencies]
idaptik-core = { workspace = true }
idaptik-net = { workspace = true }
idaptik-tui = { workspace = true }
bevy = { workspace = true }
# Keep native Wayland while avoiding the font parser used only for CSD title text.
bevy_winit = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
