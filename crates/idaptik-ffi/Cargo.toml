[package]
name = "idaptik-ffi"
description = "Current Rust-exported C ABI over idaptik-core; Zig/Idris2 policy remediation is tracked in issue #103."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# cdylib + staticlib for FFI consumers; rlib so Rust tests/other crates can use it too.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
idaptik-core = { workspace = true }
serde_json = { workspace = true }
